name: Publish Zeabur image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish to ghcr.io/sr0725/ghost
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ inputs.tag }}
    runs-on: ubuntu-latest
    concurrency:
      group: zeabur-image-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: Dockerfile.zeabur
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/sr0725/ghost:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=zeabur-production
          cache-to: type=gha,mode=max,scope=zeabur-production
